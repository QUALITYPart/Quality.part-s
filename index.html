<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quality Part X</title>
<meta name="theme-color" content="#0C111B">
<script>
/* Apply the saved theme before first paint (saved -> system -> dark) */
(function () {
  var t = null;
  try { t = localStorage.getItem("qpx-theme"); } catch (e) {}
  if (t !== "light" && t !== "dark") {
    t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
  }
  document.documentElement.setAttribute("data-theme", t);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* ===== 1. DESIGN TOKENS ===== */
:root {
  --bg:#F4F7FB; --surface:#FFFFFF; --surface-hover:#EEF2F7; --border:#D9E0EA;
  --text:#172338; --muted:#66758B; --accent:#188B5E; --accent-hover:#08764C;
  --on-accent:#FFFFFF; --on-danger:#FFFFFF; --danger:#D84D68; --warning:#AD7410;
  --accent-12:rgba(24,139,94,.12); --danger-12:rgba(216,77,104,.12); --warning-12:rgba(173,116,16,.12);
  --ring:rgba(24,139,94,.25); --backdrop:rgba(23,35,56,.4);
  --shadow-menu:0 4px 12px rgba(23,35,56,.08); --shadow-modal:0 8px 24px rgba(23,35,56,.12);
  --r-card:10px; --r-btn:8px; --header-h:56px; --bnav-h:64px; --sidebar-w:240px;
  --font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
:root[data-theme="dark"] {
  --bg:#0C111B; --surface:#141D2C; --surface-hover:#1B283C; --border:#263246;
  --text:#F4F7FB; --muted:#93A2B8; --accent:#73E0B3; --accent-hover:#42C98F;
  --on-accent:#082218; --on-danger:#2A0A10; --danger:#FF7F91; --warning:#F7C969;
  --accent-12:rgba(115,224,179,.12); --danger-12:rgba(255,127,145,.12); --warning-12:rgba(247,201,105,.12);
  --ring:rgba(115,224,179,.25); --backdrop:rgba(0,0,0,.55);
  --shadow-menu:0 4px 12px rgba(0,0,0,.35); --shadow-modal:0 8px 24px rgba(0,0,0,.45);
  color-scheme:dark;
}
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--bg); color:var(--text); font:400 16px/24px var(--font);
  font-variant-numeric:tabular-nums; -webkit-tap-highlight-color:transparent; }
button, input, select, textarea { font:inherit; color:inherit; }
button { cursor:pointer; }
a { color:inherit; text-decoration:none; }
svg.i { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; flex:none; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
[hidden] { display:none !important; }
@media (prefers-reduced-motion:reduce) { * { transition:none !important; animation:none !important; } }

/* ===== 2. BASE COMPONENTS ===== */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 16px;
  border-radius:var(--r-btn); border:1px solid var(--border); background:var(--surface); color:var(--text);
  font-weight:600; font-size:14px; transition:background .15s,border-color .15s; }
.btn:hover { background:var(--surface-hover); }
.btn.primary { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
.btn.primary:hover { background:var(--accent-hover); border-color:var(--accent-hover); }
.btn.danger { background:var(--danger); border-color:var(--danger); color:var(--on-danger); }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.icon-btn { width:44px; height:44px; border-radius:9999px; border:1px solid transparent; background:transparent;
  display:inline-flex; align-items:center; justify-content:center; color:var(--text); }
.icon-btn:hover { background:var(--surface-hover); border-color:var(--border); }
.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card); padding:16px; }
.muted { color:var(--muted); }
.chip { display:inline-flex; align-items:center; height:24px; padding:0 8px; border-radius:9999px; font-size:12px; font-weight:600; }
.chip.ok { background:var(--accent-12); color:var(--accent); }
.chip.low { background:var(--warning-12); color:var(--warning); }
.chip.out { background:var(--danger-12); color:var(--danger); }
.field { width:100%; min-height:44px; padding:0 12px; border-radius:var(--r-card); border:1px solid var(--border);
  background:var(--surface); color:var(--text); font-size:16px; }
.field::placeholder { color:var(--muted); }
.field:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 2px var(--ring); }
.skel { background:var(--surface-hover); animation:pulse 1.3s ease-in-out infinite; border-radius:var(--r-btn); }
@keyframes pulse { 50% { opacity:.5; } }
.empty { text-align:center; padding:48px 16px; }
.empty .ring { width:56px; height:56px; margin:0 auto 12px; border-radius:9999px; background:var(--surface-hover);
  display:flex; align-items:center; justify-content:center; color:var(--muted); }
.empty h2 { margin:0 0 4px; font-size:20px; line-height:26px; font-weight:600; }
.empty p { margin:0 auto 16px; max-width:360px; font-size:14px; line-height:20px; color:var(--muted); }

/* ===== 3. APP SHELL ===== */
.mhead { position:fixed; inset:0 0 auto 0; z-index:30; height:calc(var(--header-h) + env(safe-area-inset-top,0px));
  padding:env(safe-area-inset-top,0px) 8px 0; display:flex; align-items:center; justify-content:space-between;
  background:var(--surface); border-bottom:1px solid var(--border); }
.logo { display:flex; align-items:center; gap:8px; font-weight:600; font-size:16px; }
.logo .mark { width:28px; height:28px; border-radius:var(--r-btn); background:var(--accent); color:var(--on-accent);
  display:flex; align-items:center; justify-content:center; }
.logo .mark svg { width:18px; height:18px; }
.main { min-height:100vh; padding:calc(var(--header-h) + env(safe-area-inset-top,0px)) 0 calc(var(--bnav-h) + 16px + env(safe-area-inset-bottom,0px)); }
#view { padding:16px; }
.bnav { position:fixed; inset:auto 0 0 0; z-index:30; height:calc(var(--bnav-h) + env(safe-area-inset-bottom,0px));
  padding-bottom:env(safe-area-inset-bottom,0px); display:grid; grid-template-columns:repeat(4,1fr); align-items:center;
  background:var(--surface); border-top:1px solid var(--border); }
.bnav a, .bnav button.nb { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; height:100%;
  background:none; border:0; color:var(--muted); font-size:12px; line-height:16px; font-weight:600; }
.bnav [aria-current="page"] { color:var(--accent); }
.fab { position:fixed; z-index:31; right:16px; bottom:calc(var(--bnav-h) + 16px + env(safe-area-inset-bottom,0px)); width:56px; height:56px;
  border-radius:9999px; background:var(--accent); color:var(--on-accent); display:flex; align-items:center; justify-content:center;
  box-shadow:var(--shadow-modal); }
.fab:hover { background:var(--accent-hover); }
.fab svg { width:24px; height:24px; }
body.guest .fab { display:none; }
.sidebar, .topbar { display:none; }
.banner { display:flex; align-items:center; gap:8px; margin:0 0 16px; padding:8px 12px; border-radius:var(--r-card);
  background:var(--warning-12); color:var(--warning); font-size:14px; line-height:20px; font-weight:600; }
.offline { position:fixed; inset:calc(var(--header-h) + env(safe-area-inset-top,0px)) 0 auto 0; z-index:29; display:flex; align-items:center;
  justify-content:center; gap:8px; padding:6px 12px; font-size:14px; font-weight:600; background:var(--danger); color:var(--on-danger); }

@media (min-width:1024px) {
  .mhead, .bnav, .fab { display:none; }
  .sidebar { display:flex; flex-direction:column; position:fixed; inset:0 auto 0 0; width:var(--sidebar-w); z-index:20;
    background:var(--surface); border-right:1px solid var(--border); padding:16px 12px; }
  .sidebar .logo { padding:4px 8px 16px; }
  .sidebar nav { display:flex; flex-direction:column; gap:4px; }
  .sidebar nav a { display:flex; align-items:center; gap:12px; min-height:44px; padding:0 12px; border-radius:var(--r-btn);
    font-size:14px; font-weight:600; color:var(--muted); }
  .sidebar nav a:hover { background:var(--surface-hover); color:var(--text); }
  .sidebar nav a[aria-current="page"] { background:var(--accent-12); color:var(--accent); }
  .sidebar .div { margin:16px 12px 8px; font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .sidebar .foot { margin-top:auto; border-top:1px solid var(--border); padding-top:12px; }
  .sidebar .user { display:flex; align-items:center; gap:12px; padding:4px 8px; }
  .sidebar .avatar { width:36px; height:36px; border-radius:9999px; background:var(--accent-12); color:var(--accent);
    display:flex; align-items:center; justify-content:center; font-weight:600; }
  .sidebar .ver { padding:8px; font-size:12px; line-height:16px; color:var(--muted); }
  .main { margin-left:var(--sidebar-w); padding:0; }
  .topbar { display:flex; align-items:center; gap:16px; position:sticky; top:0; z-index:15; height:64px; padding:0 24px;
    background:var(--surface); border-bottom:1px solid var(--border); }
  .topbar h1 { margin:0; font-size:20px; line-height:26px; font-weight:600; white-space:nowrap; }
  .topbar .search { flex:1; max-width:480px; margin-left:auto; position:relative; }
  .topbar .search svg { position:absolute; left:12px; top:12px; color:var(--muted); }
  .topbar .search input { padding-left:40px; }
  .topbar .tools { display:flex; gap:4px; }
  #view { padding:24px; }
  .offline { inset:0 0 auto var(--sidebar-w); top:0; }
}

/* ===== 4. OVERLAYS (modal / sheet / toast) ===== */
.overlay { position:fixed; inset:0; z-index:50; background:var(--backdrop); display:flex; align-items:flex-end; justify-content:center; }
.dialog { width:100%; max-height:90vh; overflow:auto; background:var(--surface); border:1px solid var(--border);
  border-radius:14px 14px 0 0; box-shadow:var(--shadow-modal); padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px)); }
.dialog h2 { margin:0; font-size:20px; line-height:26px; font-weight:600; }
.dialog .dh { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.dialog .da { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
.dialog .da .btn { flex:1; }
.menu-item { display:flex; align-items:center; gap:12px; width:100%; min-height:48px; padding:0 8px; border:0; background:none;
  border-radius:var(--r-btn); font-size:16px; font-weight:600; text-align:left; }
.menu-item:hover { background:var(--surface-hover); }
.menu-item[disabled] { opacity:.5; cursor:not-allowed; }
@media (min-width:1024px) {
  .overlay { align-items:center; }
  .dialog { max-width:560px; border-radius:var(--r-card); padding:24px; }
  .dialog .da .btn { flex:none; }
}
#toasts { position:fixed; z-index:60; left:50%; transform:translateX(-50%); width:calc(100% - 32px); max-width:420px;
  bottom:calc(var(--bnav-h) + 16px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:8px; pointer-events:none; }
@media (min-width:1024px) { #toasts { bottom:24px; left:auto; right:24px; transform:none; } }
.toast { display:flex; align-items:center; gap:8px; padding:12px 16px; border-radius:var(--r-card); background:var(--text); color:var(--bg);
  font-size:14px; line-height:20px; font-weight:600; box-shadow:var(--shadow-menu); pointer-events:auto; }
.toast.err { background:var(--danger); color:var(--on-danger); }
.demo { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
.g2 { display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); }

/* ===== 5. LOGIN ===== */
body.guest .sidebar, body.guest .mhead, body.guest .main, body.guest .bnav { display:none; }
body.guest .offline { inset:0 0 auto 0; }
/* ===== 5b. LOGIN: animated four-digit PIN (the supplied design), in the new site's colours ===== */
.login { min-height:100vh; display:block; padding:0; }
.auth-screen { width:100%; min-height:100vh; min-height:100svh; display:flex; align-items:center; justify-content:center; padding:56px 24px 40px; position:relative; overflow:hidden;
  background:radial-gradient(1100px 560px at 50% -10%, var(--surface-hover) 0%, transparent 60%), radial-gradient(900px 500px at 90% 110%, var(--accent-12) 0%, transparent 55%), var(--bg);
  color:var(--text); }
.auth-theme-toggle { position:fixed; top:calc(18px + env(safe-area-inset-top,0px)); right:18px; width:42px; height:42px; z-index:2; display:grid; place-items:center;
  border:1px solid var(--border); border-radius:12px; background:var(--surface); color:var(--muted); box-shadow:var(--shadow-menu); transition:border-color .2s ease, color .2s ease, transform .2s ease; }
.auth-theme-toggle:hover { color:var(--text); border-color:var(--accent); transform:translateY(-1px); }
.auth-page { width:100%; max-width:460px; display:flex; flex-direction:column; align-items:center; }
.auth-copy { display:contents; }
.auth-copy-content { display:none; }
.auth-brand { display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:34px; }
.auth-mark { flex:none; width:40px; height:40px; border-radius:12px; display:grid; place-items:center; background:var(--accent); color:var(--on-accent); }
.auth-mark svg { width:24px; height:24px; }
.auth-brand-text { display:flex; flex-direction:column; align-items:flex-start; gap:2px; min-width:0; }
.auth-brand-text b { font-size:17.6px; line-height:22px; font-weight:600; color:var(--text); }
.auth-brand-subtitle { font-size:12.5px; line-height:16px; color:var(--muted); letter-spacing:.02em; }
.auth-card { width:100%; position:relative; text-align:center; padding:38px 30px 32px; border:1px solid var(--border); border-radius:20px;
  background:linear-gradient(180deg, var(--surface-hover), var(--surface)); box-shadow:0 30px 80px -30px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.02); }
.auth-card::before { content:""; position:absolute; top:-1px; left:20%; right:20%; height:1px; background:linear-gradient(90deg, transparent, var(--accent), transparent); opacity:.55; }
.auth-handle { width:36px; height:4px; border-radius:99px; background:var(--border); margin:0 auto 22px; }
.auth-card h1 { margin:0 0 10px; font-size:22px; line-height:28px; font-weight:600; letter-spacing:-.2px; }
.auth-sub { margin:0 0 26px; font-size:14.5px; line-height:1.5; color:var(--muted); }
.auth-field { display:flex; flex-direction:column; gap:7px; text-align:left; margin-bottom:24px; }
.auth-field label, .auth-pin-label { font-size:12.5px; line-height:16px; font-weight:600; color:var(--muted); }
.auth-pin-label { display:block; text-align:left; margin-bottom:9px; }
.auth-field input { width:100%; height:46px; padding:10px 12px; border:1px solid var(--border); border-radius:12px; background:var(--bg); color:var(--text); outline:none; transition:border-color .2s ease, box-shadow .2s ease; }
.auth-field input:focus { border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-12); }
.auth-card input::placeholder { color:var(--muted); opacity:.75; }
.auth-stage { position:relative; height:86px; margin:0 0 26px; direction:ltr; }
.auth-slots { position:absolute; inset:0; display:flex; justify-content:center; align-items:flex-start; gap:14px; padding-top:8px; }
.auth-slot { position:relative; width:58px; height:66px; transform-origin:50% 320%; will-change:transform, opacity; }
.auth-slot input { position:relative; z-index:1; width:100%; height:100%; padding:0; text-align:center; font-size:24px; font-weight:600; color:var(--text); background:var(--bg);
  border:1.5px solid var(--border); border-radius:14px; outline:none; caret-color:var(--accent); -moz-appearance:textfield; transition:border-color .2s ease, box-shadow .2s ease; }
.auth-slot input::-webkit-outer-spin-button, .auth-slot input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
.auth-slot input:focus { border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-12); }
.auth-slot.filled input { border-color:var(--accent); box-shadow:0 0 12px -2px var(--ring); }
.auth-slot__win { position:absolute; inset:-4px; z-index:2; pointer-events:none; }
.auth-slot__spark { width:100%; height:100%; overflow:visible; }
.auth-slot__spark rect { fill:none; stroke:var(--accent); stroke-width:2.5; stroke-linecap:round; stroke-dasharray:1; stroke-dashoffset:1; opacity:0; }
.auth-slot.glowing .auth-slot__spark rect { animation:authLap .5s ease forwards; }
@keyframes authLap { 0% { stroke-dashoffset:1; opacity:1; } 80% { stroke-dashoffset:0; opacity:1; } 100% { stroke-dashoffset:0; opacity:0; } }
.auth-result { position:absolute; top:8px; left:50%; width:58px; height:66px; margin-left:-29px; z-index:4; pointer-events:none; display:flex; align-items:center; justify-content:center;
  border-radius:14px; background:var(--bg); border:1.5px solid var(--border); opacity:0; transform:scale(.4); }
.auth-result.show { opacity:1; transform:scale(1); transition:transform .5s cubic-bezier(.34,1.55,.4,1), opacity .28s ease; }
.auth-result.win { border-color:var(--accent); box-shadow:0 0 0 5px var(--accent-12), 0 0 26px -2px var(--accent); }
.auth-result.bad { border-color:var(--danger); box-shadow:0 0 0 5px var(--danger-12), 0 0 26px -2px var(--danger); }
.auth-result svg { position:absolute; width:26px; height:26px; }
.auth-check path, .auth-x path { fill:none; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:24; stroke-dashoffset:24; }
.auth-check path { stroke:var(--accent); }
.auth-x path { stroke:var(--danger); opacity:0; }
.auth-result.win .auth-check path { animation:authDraw .3s ease .18s forwards; }
.auth-result.bad .auth-check { opacity:0; }
.auth-result.bad .auth-x path { opacity:1; animation:authDraw .22s ease forwards; }
@keyframes authDraw { to { stroke-dashoffset:0; } }
@media (prefers-reduced-motion:reduce) { .auth-result.win .auth-check path, .auth-result.bad .auth-x path { stroke-dashoffset:0 !important; } }
.auth-status { min-height:18px; margin:0 0 22px; font-size:13px; line-height:18px; color:var(--danger); opacity:0; transition:opacity .18s ease; }
.auth-status.show { opacity:1; }
.auth-status.ok { color:var(--accent); font-weight:600; }
.auth-status.info { color:var(--muted); }
.auth-login-btn { width:100%; min-height:46px; border-radius:12px; }
.auth-footnote { margin:26px 0 0; font-size:12.5px; line-height:1.6; color:var(--muted); }
.auth-footnote small { display:block; margin-top:4px; font-size:12px; opacity:.8; }
@media (min-width:900px) {
  .auth-screen { padding:48px clamp(32px,7vw,112px); align-items:stretch; }
  .auth-page { width:min(1120px,100%); max-width:none; display:grid; grid-template-columns:minmax(0,1fr) minmax(400px,460px); align-items:center; gap:clamp(48px,8vw,120px); }
  .auth-copy { display:flex; flex-direction:column; align-items:flex-start; justify-content:center; gap:30px; min-width:0; }
  .auth-brand { margin:0; }
  .auth-copy-content { display:block; max-width:520px; text-align:left; }
  .auth-copy-content h2 { margin:0 0 14px; font-size:clamp(2.2rem,4vw,4rem); line-height:1.08; letter-spacing:-.055em; font-weight:600; }
  .auth-copy-content p { margin:0; max-width:44rem; font-size:16px; line-height:1.7; color:var(--muted); }
  .auth-card { align-self:center; }
}
.field.bad { border-color:var(--danger); }
.splash { position:fixed; inset:0; z-index:70; display:flex; align-items:center; justify-content:center; background:var(--bg); }
.splash .logo .mark { width:44px; height:44px; }
.splash .logo .mark svg { width:26px; height:26px; }
.mhead .who { font-size:12px; line-height:16px; color:var(--muted); }
.sheet-user { display:flex; align-items:center; gap:12px; padding:0 8px 12px; margin-bottom:8px; border-bottom:1px solid var(--border); }
.sheet-user .avatar { width:40px; height:40px; border-radius:9999px; background:var(--accent-12); color:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:600; }
.sheet-user .nm { font-size:16px; line-height:22px; font-weight:600; }
.sheet-user .rl { font-size:12px; line-height:16px; color:var(--muted); }

/* ===== 6b. PART CARD, PHOTO VIEWER, PARTS PAGE (CSS) ===== */
.pgrid { display:grid; grid-template-columns:1fr; gap:12px; align-items:start; }
@media (min-width:600px) { .pgrid { grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:16px; } }
.pcard { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card); overflow:hidden; min-width:0; }
.pcard .ph { position:relative; aspect-ratio:4/3; background:var(--surface-hover); touch-action:pan-y; overflow:hidden; }
.pcard .ph img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; display:block; opacity:0; transition:opacity .15s; }
.pcard .ph.loaded img { opacity:1; }
.pcard .ph .ph-sk { position:absolute; inset:0; border-radius:0; }
.pcard .ph.loaded .ph-sk { display:none; }
.pcard .ph .nophoto { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); }
.pcard .ph .nophoto svg { width:40px; height:40px; }
.pcard .ph .open { position:absolute; inset:0; border:0; background:none; padding:0; }

function applyPartFilters(qb, f) {

  /* options is an object: { "__all__": [..] } or { "<Make or Part type>": [..] } depending on depends_on */

  });

/* Uploads new photos to "<partId>/..." and returns all public URLs in order. Removes what it uploaded if one upload fails. */
async function uploadPhotos(partId, photos) {
  const urls = [], made = [];
  try {
    for (let i = 0; i < photos.length; i++) {
      const ph = photos[i];
      if (!ph.file) { urls.push(ph.url); continue; }
      const path = partId + "/" + Date.now() + "-" + i + ".jpg";
      const up = await sb.storage.from(BUCKET).upload(path, ph.file, { contentType: "image/jpeg", upsert: false });
      if (up.error) throw up.error;
      made.push(path);
      urls.push(sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl);
    }
  } catch (e) { await removePaths(made); throw e; }
  return { urls, made };
}

/* ONE service for every quantity change (add stock, consume, steppers, edit). Calls adjust_part_quantity (06_stock_function.sql).
   Until that SQL is run, a guarded fallback (compare-and-swap on the old quantity) keeps the app working. Never goes below zero. */
const Stock = {
  async adjust(id, delta, type) {
    delta = Math.trunc(delta);
    if (!delta) throw new Error("Nothing to change");
    const r = await sb.rpc("adjust_part_quantity", { p_part_id: id, p_delta: delta, p_type: type });
    if (!r.error) { const q = Number(Array.isArray(r.data) ? r.data[0] : r.data); this.changed(id, q); return q; }
    const m = String(r.error.message || "");
    if (/not enough stock/i.test(m)) throw new Error("Not enough stock");
    if (r.error.code === "PGRST202" || /could not find the function|schema cache/i.test(m)) return this.fallback(id, delta, type);
    throw r.error;
  },
  async fallback(id, delta, type) {
    const g = await sb.from("parts").select("name,quantity").eq("id", id).maybeSingle();
    if (g.error || !g.data) throw g.error || new Error("Part not found");
    const old = Number(g.data.quantity) || 0, nq = old + delta;
    if (nq < 0) throw new Error("Not enough stock");
    const u = await dbWrite((row) => sb.from("parts").update(row).eq("id", id).eq("quantity", old).select("quantity"), { quantity: nq, updated_at: new Date().toISOString() });
    if (u.error) throw u.error;
    if (!u.data || !u.data.length) throw new Error("Stock changed meanwhile. Please try again.");
    const t = await sb.from("transactions").insert({ id: uuid(), part_id: id, part_name: g.data.name, type: type, qty: Math.abs(delta), at: new Date().toISOString() });
    if (t.error) toast("Stock updated but the activity log failed", true);
    this.changed(id, nq);
    return nq;
  },
  /* refresh every visible place that shows this part */
  changed(id, q) {
    const p = PARTS.get(id); if (p) p.quantity = q;
    PS.rows.forEach((r) => { if (r.id === id) r.quantity = q; });
    document.querySelectorAll('.pcard[data-id="' + id + '"]').forEach((c) => paintQty(c, q));
    homeSoon();
  }
};
function paintQty(card, q) {
  const b = card.querySelector(".qb"); if (b) { b.className = "qb " + stockStatus(q); b.textContent = "Qty " + fmtNum(q); }
  const v = card.querySelector(".stepper .v"); if (v) v.textContent = fmtNum(q);
  card.querySelectorAll("dt").forEach((dt) => { if (dt.textContent === "Quantity" && dt.nextElementSibling) dt.nextElementSibling.textContent = fmtNum(q); });
}
function replaceCards(np) {
  PARTS.set(np.id, np);
  PS.rows = PS.rows.map((r) => r.id === np.id ? np : r);
  document.querySelectorAll('.pcard[data-id="' + np.id + '"]').forEach((c) => {
    const t = document.createElement("template");

function forgetPart(id) {

/* Shared stepper on the card: +1 logs "add", -1 logs "consume" */
async function stepStock(card, p, d) {

function wireActRows(root) {
  root.querySelectorAll(".ascroll").forEach(actFade);
  root.querySelectorAll(".aph img").forEach((img) => img.addEventListener("error", () => { const box = img.parentNode; img.remove(); box.insertAdjacentHTML("afterbegin", icon("camera")); }));
  if (root.dataset.wired) return;

  /* touch scrolls natively; with a mouse the strip can be dragged sideways */

    if (e.pointerType === "touch" || e.button !== 0) return;

  });
  root.addEventListener("pointermove", (e) => {
    if (!drag || drag.id !== e.pointerId) return;
    const dx = e.clientX - drag.x;
    if (Math.abs(dx) > 3) { moved = true; drag.el.classList.add("dragging"); }
    if (moved) drag.el.scrollLeft = drag.left - dx;
  });
  const end = () => { if (!drag) return; drag.el.classList.remove("dragging"); drag = null; suppress = moved; moved = false; setTimeout(() => { suppress = false; }, 60); };
  ["pointerup", "pointercancel", "pointerleave"].forEach((n) => root.addEventListener(n, end));
  root.addEventListener("click", (e) => {
    if (suppress) return;
    const row = e.target.closest(".arow.go"); if (!row) return;

/* Downloads a photo and shrinks it to a small JPEG (max 140 x 105) so the Excel file stays light */
async function photoThumb(url, signal) {
  const r = await fetch(url, { signal: signal, mode: "cors" });
  if (!r.ok) throw new Error("photo " + r.status);
  const obj = URL.createObjectURL(await r.blob());
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("bad image")); i.src = obj; });
    const k = Math.min(1, 140 / img.width, 105 / img.height), w = Math.max(1, Math.round(img.width * k)), h = Math.max(1, Math.round(img.height * k));
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    const x = c.getContext("2d"); x.fillStyle = "#ffffff"; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
    return { base64: c.toDataURL("image/jpeg", 0.72), w: w, h: h };
  } finally { URL.revokeObjectURL(obj); }
}

/* Same rule as the old app and the manage-employee Edge Function: Supabase Auth needs 6+ characters,
   so the 4-digit PIN gets a fixed private suffix. Do NOT change it or existing accounts stop working. */
const AUTH_PASSWORD_SUFFIX = "QPX-Account-2026!";
const pinToPassword = (pin) => pin + AUTH_PASSWORD_SUFFIX;
const LOGIN_MESSAGES = {
  wait: "Too many sign-in attempts. Please wait a few minutes and try again.",
  bad: "Incorrect username or PIN",
  net: "Cannot reach the server. Check your internet connection and try again.",
  inactive: "This account is not active. Please ask an admin.",
  noprofile: "This account has no employee profile. Please ask an admin.",
  expired: "Your session has expired. Please sign in again."
};
let signingOut = false;

function showSplash(on) { $("#splash").hidden = !on; }
function setGuest(on) { document.body.classList.toggle("guest", on); $("#login").hidden = !on; }

/* Find the sign-in e-mail returned by the RPC (string, object or array of objects) */
function extractEmail(data) {
  if (!data) return null;
  if (Array.isArray(data)) return data.length ? extractEmail(data[0]) : null;
  if (typeof data === "string") return data;
  if (typeof data === "object") return data.auth_email || data.email || data.login_email || null;
  return null;
}
async function loadProfile(userId) {
  const { data, error } = await sb.from("employees").select("id,username,role,is_active").eq("auth_user_id", userId).maybeSingle();
  if (error) throw error;
  return data;
}
function applyUser(p) {
  state.user = { id: p.id, username: p.username, role: p.role === "admin" ? "admin" : "employee" };
  state.role = state.user.role;
}
/* Sign in with username + PIN. Returns { ok:true } or { ok:false, msg } */
async function doLogin(username, pin) {
  if (!sb) return { ok: false, msg: LOGIN_MESSAGES.net };
  if (!navigator.onLine) return { ok: false, msg: LOGIN_MESSAGES.net };
  try {
    const r = await sb.rpc("get_employee_login_identity", { p_username: username });
    if (r.error) { if (/too many/i.test(r.error.message || "")) return { ok: false, msg: LOGIN_MESSAGES.wait }; if (/fetch|network/i.test(r.error.message || "")) return { ok: false, msg: LOGIN_MESSAGES.net }; return { ok: false, msg: LOGIN_MESSAGES.bad, count: true }; }
    const email = extractEmail(r.data);
    if (!email) return { ok: false, msg: LOGIN_MESSAGES.bad, count: true };
    const a = await sb.auth.signInWithPassword({ email: email, password: pinToPassword(pin) });
    if (a.error || !a.data || !a.data.user) {
      if (a.error && /fetch|network/i.test(a.error.message || "")) return { ok: false, msg: LOGIN_MESSAGES.net };
      return { ok: false, msg: LOGIN_MESSAGES.bad, count: true };
    }
    const prof = await loadProfile(a.data.user.id);
    if (!prof) { await sb.auth.signOut(); return { ok: false, msg: LOGIN_MESSAGES.noprofile }; }
    if (prof.is_active === false) { await sb.auth.signOut(); return { ok: false, msg: LOGIN_MESSAGES.inactive }; }
    applyUser(prof);
    return { ok: true };
  } catch (e) {
    return { ok: false, msg: LOGIN_MESSAGES.net };
  }
}
async function signOut(msg) {
  if (signingOut) return;
  signingOut = true;
  try { if (sb) await sb.auth.signOut(); } catch (e) { /* ignore */ }
  state.user = null; state.role = null;
  if (routeCleanup) { routeCleanup(); routeCleanup = null; }
  closeOverlay();
  signingOut = false;
  showLogin(msg || "");
}

  let busy = false, playing = false;
  const alive = () => me === loginSession && document.body.contains(form);
  const pinValue = () => inputs.map((i) => i.value).join("");
  function setStatus(msg, kind) { statusEl.textContent = msg || ""; statusEl.className = "auth-status" + (msg ? " show" : "") + (kind ? " " + kind : ""); }
  function refreshBtn() {
    const left = Math.ceil((lockUntil - Date.now()) / 1000);
    if (playing) { btn.disabled = true; btn.textContent = "Sign in"; if (left > 0 && !lockTimer) lockTimer = setInterval(() => { if (!alive()) { clearInterval(lockTimer); lockTimer = null; return; } refreshBtn(); }, 500); }
    else if (left > 0) { btn.disabled = true; btn.textContent = "Try again in " + left + "s"; if (!lockTimer) lockTimer = setInterval(() => { if (!alive()) { clearInterval(lockTimer); lockTimer = null; return; } refreshBtn(); }, 500); }
    else { if (lockTimer) { clearInterval(lockTimer); lockTimer = null; } btn.textContent = "Sign in"; btn.disabled = busy || playing; }
  }
  /* the lap that runs a slot's edge on every keystroke */
  function pulse(i) { const s = slots[i]; s.classList.remove("glowing"); void s.offsetWidth; s.classList.add("glowing"); }
  function resetPins() {
    playing = false;
    result.classList.remove("show", "win", "bad");
    setStatus("");
    slots.forEach((s) => { s.getAnimations().forEach((a) => a.cancel()); s.classList.remove("filled", "glowing"); s.style.opacity = ""; s.style.transform = ""; });
    inputs.forEach((i) => { i.value = ""; i.disabled = false; i.style.pointerEvents = ""; });
    refreshBtn();
    inputs[0].focus();
  }
  /* four cards spread like a hand, then converge into one verdict (check or cross) */
  function sequence(ok, msg, done) {
    playing = true;
    result.classList.remove("show", "win", "bad");
    inputs.forEach((i) => { i.style.pointerEvents = "none"; });
    const verdict = () => {
      if (!alive()) return;
      result.classList.add("show", ok ? "win" : "bad");
      setStatus(ok ? "Signed in successfully." : msg, ok ? "ok" : "");
      if (ok) setTimeout(() => { if (alive()) done(); }, 700);
    };
    if (reducedMotion()) { slots.forEach((s) => { s.style.opacity = "0"; }); verdict(); if (!ok) setTimeout(() => { if (alive()) resetPins(); }, 3200); return; }
    const dx = [-30, -10, 10, 30], ang = [-16, -6, 6, 16], home = [-7, -3, 3, 7], spreadEnd = 560 + 3 * 45, convergeEnd = 460 + 3 * 40;
    slots.forEach((s, i) => {
      s.animate([{ transform: "translate(0px) rotate(0deg)" }, { transform: "translate(" + dx[i] + "px) rotate(" + ang[i] + "deg)" }],
        { duration: 560, delay: i * 45, easing: "cubic-bezier(.22,.8,.25,1)", fill: "forwards" });
    });
    setTimeout(() => {
      if (!alive()) return;
      slots.forEach((s, i) => {
        s.animate([
          { transform: "translate(" + dx[i] + "px) rotate(" + ang[i] + "deg)", offset: 0 },
          { transform: "translate(0px) rotate(" + home[i] + "deg)", opacity: 1, offset: 0.78 },
          { transform: "translate(0px) rotate(0deg)", opacity: 0, offset: 1 }
        ], { duration: 460, delay: (3 - i) * 40, easing: "cubic-bezier(.3,.7,.25,1)", fill: "forwards" });
      });
      setTimeout(verdict, convergeEnd + 30);
    }, spreadEnd + 120);
    if (!ok) setTimeout(() => { if (alive()) resetPins(); }, spreadEnd + 120 + convergeEnd + 30 + 3200);
  }
  async function submit() {
    if (busy || playing || lockUntil > Date.now()) return;
    const u = user.value.trim(), pin = pinValue();
    if (!u) { setStatus("Enter your username first."); user.focus(); return; }
    if (!/^\d{4}$/.test(pin)) { setStatus("Enter your 4-digit PIN."); const first = inputs.find((i) => !i.value); if (first) first.focus(); return; }
    busy = true; btn.disabled = true; inputs.forEach((i) => { i.disabled = true; }); setStatus("Checking your credentials…", "info");
    const res = await doLogin(u, pin);
    busy = false;
    if (!alive()) { if (res.ok) enterApp(); return; }
    if (res.ok) { failCount = 0; lockUntil = 0; sequence(true, "", enterApp); return; }
    if (res.count) {
      failCount++;
      /* client-side pause only; the real limit is on the server (Auth rate limits + optional 10_login_throttle.sql) */
      if (failCount >= 3) lockUntil = Date.now() + SEQUENCE_MS + Math.min(60, 5 * Math.pow(2, failCount - 3)) * 1000;   /* the pause starts when the animation ends */
    }
    refreshBtn();
    sequence(false, res.msg, null);
  }
  inputs.forEach((input, i) => {
    input.addEventListener("focus", () => input.select());
    input.addEventListener("input", (e) => {
      if (busy || playing) return;
      const v = e.target.value.replace(/\D/g, "").slice(0, 1);
      e.target.value = v;
      slots[i].classList.toggle("filled", !!v);
      setStatus("");
      if (v) { pulse(i); if (inputs[i + 1]) inputs[i + 1].focus(); }
      if (inputs.every((x) => x.value)) submit();
    });
    input.addEventListener("keydown", (e) => {
      if (busy || playing) return;
      if (e.key === "Backspace" && !input.value && inputs[i - 1]) inputs[i - 1].focus();
      else if (e.key === "ArrowLeft" && inputs[i - 1]) { e.preventDefault(); inputs[i - 1].focus(); }
      else if (e.key === "ArrowRight" && inputs[i + 1]) { e.preventDefault(); inputs[i + 1].focus(); }
      else if (e.key === "Enter") { e.preventDefault(); submit(); }
    });
    input.addEventListener("paste", (e) => {
      if (busy || playing) return;
      e.preventDefault();
      const text = ((e.clipboardData || window.clipboardData).getData("text") || "").replace(/\D/g, "").slice(0, 4);
      if (!text) return;
      text.split("").forEach((ch, k) => { inputs[k].value = ch; slots[k].classList.add("filled"); pulse(k); });
      inputs[Math.min(text.length, 3)].focus();
      if (inputs.every((x) => x.value)) submit();
    });
  });
  form.addEventListener("submit", (e) => { e.preventDefault(); submit(); });
  user.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); if (/^\d{4}$/.test(pinValue())) submit(); else (inputs.find((x) => !x.value) || inputs[0]).focus(); } });
  if (message) setStatus(message);
  refreshBtn();
  setTimeout(() => { if (alive()) user.focus(); }, 80);
}

/* Session start: restore the saved session or show the login screen */
async function boot() {
  if (!sb) { showLogin("Could not load the Supabase library. Check your connection and reload."); return; }
  try {
    const { data } = await sb.auth.getSession();
    if (data && data.session) {
      const prof = await loadProfile(data.session.user.id);
      if (prof && prof.is_active !== false) { applyUser(prof); enterApp(); return; }
      await sb.auth.signOut();
      showLogin(prof ? LOGIN_MESSAGES.inactive : LOGIN_MESSAGES.noprofile);
      return;
    }
  } catch (e) {
    /* offline with a saved session: cannot verify the profile, ask to sign in again when online */
  }
  showLogin("");
}
if (sb) {
  sb.auth.onAuthStateChange((event) => {
    /* Signed out elsewhere or refresh token no longer valid while the app is open */
    if (event === "SIGNED_OUT" && state.user && !signingOut) {
      state.user = null; state.role = null; closeOverlay(); showLogin(LOGIN_MESSAGES.expired);
    }
  });
}

/* Keeps Tab / Shift+Tab inside the open dialog or photo viewer */
function trapTab(e) {
  const box = $("#layer .dialog") || $("#layer .viewer"); if (!box) return;
  const f = Array.from(box.querySelectorAll('button, a[href], input, select, textarea, [tabindex]:not([tabindex="-1"])')).filter((x) => !x.disabled && !x.closest("[hidden]") && x.offsetParent !== null);
  if (!f.length) { e.preventDefault(); return; }
  const first = f[0], last = f[f.length - 1], a = document.activeElement;
  if (!box.contains(a)) { e.preventDefault(); first.focus(); }
  else if (e.shiftKey && a === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && a === last) { e.preventDefault(); first.focus(); }
}

/* ===== 16. STARTUP ===== */
function start() {
  $("#splashMark").innerHTML = icon("parts", 26);
  applyTheme(document.documentElement.getAttribute("data-theme"));
  $("#globalSearch").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.value.trim()) location.hash = "#/parts?q=" + encodeURIComponent(e.target.value.trim());
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !$("#layer").firstChild) closeFloatingCards();
    if (e.key === "Escape" && $("#layer").firstChild) closeOverlay();
    else if (e.key === "Tab" && $("#layer").firstChild) trapTab(e);
    else if ($(".viewer") && viewerNav && (e.key === "ArrowLeft" || e.key === "ArrowRight")) viewerNav(e.key === "ArrowLeft" ? -1 : 1);
  });
  document.addEventListener("click", (e) => { if (e.target.closest && e.target.closest("a[data-close]")) closeOverlay(); closeFloatingCards(e.target); });
  window.addEventListener("online", () => setOffline(false));
  window.addEventListener("offline", () => setOffline(true));
  window.addEventListener("hashchange", render);
  wireCardTips();
  if (!navigator.onLine) setOffline(true);
  boot();
}
start();
